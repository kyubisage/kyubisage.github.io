<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no"/>
  <title>Rogue Bomber — TJ</title>
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Space+Mono:ital@0;1&display=swap" rel="stylesheet"/>
  <style>
    :root {
      --black:#080808;--off-black:#0f0f0f;--surface:#141414;--surface-raised:#1c1c1c;
      --border:rgba(255,255,255,0.07);--white:#f5f0eb;--white-dim:rgba(245,240,235,0.5);
      --white-faint:rgba(245,240,235,0.1);--accent:#c8a96e;--accent-dim:rgba(200,169,110,0.25);
      --red:#d94f3d;--green:#4a9e6b;--ice:#6ec8c8;--shock:#c86ec8;
      --font-display:'Bebas Neue',sans-serif;--font-mono:'Space Mono',monospace;
    }
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
    html,body{height:100%;overflow:hidden;background:var(--black);color:var(--white);font-family:var(--font-mono);}
    body::before{content:'';position:fixed;inset:0;background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='1'/%3E%3C/svg%3E");opacity:0.025;pointer-events:none;z-index:9000;}
    #back-btn{position:fixed;top:16px;left:16px;z-index:100;font-family:var(--font-mono);font-size:0.6rem;letter-spacing:0.15em;text-transform:uppercase;color:var(--accent);border:1px solid var(--accent-dim);padding:8px 14px;background:rgba(8,8,8,0.9);cursor:pointer;transition:all 0.3s;text-decoration:none;}
    #back-btn:hover{background:var(--accent);color:var(--black);}
    #game-wrapper{display:flex;flex-direction:column;align-items:center;justify-content:center;height:100vh;gap:10px;padding:8px;}
    #hud{display:flex;align-items:center;gap:16px;width:100%;max-width:520px;flex-wrap:wrap;justify-content:space-between;}
    .hud-block{display:flex;flex-direction:column;align-items:center;gap:2px;}
    .hud-label{font-size:0.5rem;letter-spacing:0.15em;text-transform:uppercase;color:var(--white-dim);}
    .hud-val{font-family:var(--font-display);font-size:1.4rem;color:var(--accent);letter-spacing:0.1em;}
    #lives-display{display:flex;gap:4px;}
    .life-icon{width:12px;height:12px;background:var(--accent);clip-path:polygon(50% 0%,61% 35%,98% 35%,68% 57%,79% 91%,50% 70%,21% 91%,32% 57%,2% 35%,39% 35%);}
    .life-icon.lost{opacity:0.15;}
    #canvas-wrap{position:relative;border:1px solid var(--border);}
    #canvas-wrap::before{content:'';position:absolute;inset:-1px;border:1px solid var(--accent-dim);pointer-events:none;z-index:5;}
    canvas{display:block;}
    /* Mobile controls */
    #mobile-controls{display:none;flex-direction:column;align-items:center;gap:6px;width:100%;max-width:520px;}
    #dpad{display:grid;grid-template-columns:repeat(3,52px);grid-template-rows:repeat(3,52px);gap:4px;}
    .dpad-btn{width:52px;height:52px;background:var(--surface-raised);border:1px solid var(--border);color:var(--white-dim);font-size:1.2rem;cursor:pointer;display:flex;align-items:center;justify-content:center;-webkit-tap-highlight-color:transparent;user-select:none;transition:background 0.1s,border-color 0.1s;border-radius:4px;}
    .dpad-btn:active,.dpad-btn.pressed{background:var(--accent-dim);border-color:var(--accent);}
    .dpad-center{background:transparent!important;border:none!important;}
    #bomb-btn{width:72px;height:72px;background:var(--surface-raised);border:2px solid var(--accent-dim);color:var(--accent);font-family:var(--font-display);font-size:0.85rem;letter-spacing:0.1em;cursor:pointer;border-radius:50%;-webkit-tap-highlight-color:transparent;user-select:none;transition:all 0.1s;}
    #bomb-btn:active,#bomb-btn.pressed{background:var(--accent);color:var(--black);}
    .action-row{display:flex;gap:16px;align-items:center;}
    #pause-btn{font-family:var(--font-mono);font-size:0.55rem;letter-spacing:0.1em;text-transform:uppercase;color:var(--white-dim);border:1px solid var(--border);padding:8px 14px;background:var(--surface);cursor:pointer;transition:all 0.2s;}
    #pause-btn:hover,#pause-btn:active{border-color:var(--accent);color:var(--accent);}
    @media(max-width:600px),(pointer:coarse){#mobile-controls{display:flex;}}
    /* Overlays */
    .overlay{position:fixed;inset:0;background:rgba(8,8,8,0.95);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:20px;z-index:200;padding:24px;text-align:center;}
    .overlay-title{font-family:var(--font-display);font-size:4rem;letter-spacing:0.15em;color:var(--accent);}
    .overlay-sub{font-size:0.65rem;letter-spacing:0.15em;text-transform:uppercase;color:var(--white-dim);max-width:320px;line-height:1.8;}
    .overlay-btn{font-family:var(--font-mono);font-size:0.65rem;letter-spacing:0.15em;text-transform:uppercase;color:var(--black);background:var(--accent);border:none;padding:14px 32px;cursor:pointer;transition:all 0.2s;}
    .overlay-btn:hover{background:var(--white);}
    .overlay-btn.secondary{background:transparent;color:var(--white-dim);border:1px solid var(--border);}
    .overlay-btn.secondary:hover{border-color:var(--accent);color:var(--accent);}
    .upgrade-cards{display:flex;gap:12px;flex-wrap:wrap;justify-content:center;max-width:500px;}
    .upgrade-card{flex:1;min-width:130px;max-width:160px;border:1px solid var(--border);padding:16px 12px;cursor:pointer;transition:all 0.2s;background:var(--surface);display:flex;flex-direction:column;gap:8px;align-items:center;text-align:center;}
    .upgrade-card:hover{border-color:var(--accent);background:var(--accent-dim);}
    .upgrade-icon{font-size:1.8rem;}
    .upgrade-name{font-family:var(--font-display);font-size:1rem;letter-spacing:0.1em;color:var(--accent);}
    .upgrade-desc{font-size:0.55rem;letter-spacing:0.08em;color:var(--white-dim);line-height:1.6;}
    .wave-banner{font-family:var(--font-display);font-size:1.2rem;letter-spacing:0.2em;color:var(--accent);}
    .stats-row{display:flex;gap:24px;flex-wrap:wrap;justify-content:center;}
    .stat-item{display:flex;flex-direction:column;align-items:center;gap:4px;}
    .stat-val{font-family:var(--font-display);font-size:1.6rem;color:var(--accent);}
    .stat-lbl{font-size:0.5rem;letter-spacing:0.12em;text-transform:uppercase;color:var(--white-dim);}
    #screen-flash{position:fixed;inset:0;pointer-events:none;z-index:8999;opacity:0;transition:opacity 0.05s;}
  </style>
</head>
<body>
<a href="/" id="back-btn">← Back</a>
<div id="screen-flash"></div>
<div id="game-wrapper">
  <div id="hud">
    <div class="hud-block"><span class="hud-label">Score</span><span class="hud-val" id="hud-score">0</span></div>
    <div class="hud-block"><span class="hud-label">Level</span><span class="hud-val" id="hud-level">1</span></div>
    <div class="hud-block"><span class="hud-label">Lives</span><div id="lives-display"></div></div>
    <div class="hud-block"><span class="hud-label">Bombs</span><span class="hud-val" id="hud-bombs">1</span></div>
    <div class="hud-block"><span class="hud-label">Range</span><span class="hud-val" id="hud-range">2</span></div>
  </div>
  <div id="canvas-wrap"><canvas id="game"></canvas></div>
  <div id="mobile-controls">
    <div class="action-row">
      <div id="dpad">
        <div></div><button class="dpad-btn" id="btn-up">▲</button><div></div>
        <button class="dpad-btn" id="btn-left">◀</button>
        <div class="dpad-btn dpad-center"></div>
        <button class="dpad-btn" id="btn-right">▶</button>
        <div></div><button class="dpad-btn" id="btn-down">▼</button><div></div>
      </div>
      <button id="bomb-btn">BOMB</button>
    </div>
    <button id="pause-btn">Pause</button>
  </div>
</div>

<!-- Overlays -->
<div class="overlay" id="overlay-start">
  <div class="overlay-title">Rogue Bomber</div>
  <div class="overlay-sub">Place bombs. Clear enemies. Collect upgrades. Survive the descent.</div>
  <div class="overlay-sub" style="font-size:0.55rem;margin-top:-8px;">WASD / Arrows to move — Space to bomb</div>
  <button class="overlay-btn" id="btn-start">Begin Run</button>
</div>
<div class="overlay" id="overlay-upgrade" style="display:none;">
  <div class="wave-banner" id="upgrade-wave">WAVE 1 CLEARED</div>
  <div class="overlay-title" style="font-size:2.5rem;">Choose Upgrade</div>
  <div class="upgrade-cards" id="upgrade-cards"></div>
</div>
<div class="overlay" id="overlay-death" style="display:none;">
  <div class="overlay-title" style="color:var(--red);">You Died</div>
  <div class="stats-row" id="death-stats"></div>
  <button class="overlay-btn" id="btn-restart">New Run</button>
</div>
<div class="overlay" id="overlay-pause" style="display:none;">
  <div class="overlay-title">Paused</div>
  <button class="overlay-btn" id="btn-resume">Resume</button>
  <button class="overlay-btn secondary" id="btn-quit">Quit Run</button>
</div>
<div class="overlay" id="overlay-boss" style="display:none;">
  <div class="overlay-title" style="font-size:2.8rem;">Boss Incoming</div>
  <div class="overlay-sub" id="boss-name-text">The Warden</div>
  <div class="overlay-sub">Adapt your strategy.</div>
  <button class="overlay-btn" id="btn-boss-start">Face It</button>
</div>

<script>
// ══════════════════════════════════════════════
//  AUDIO ENGINE
// ══════════════════════════════════════════════
const AC = typeof AudioContext !== 'undefined' ? new AudioContext() : null;
let masterGain;
if (AC) { masterGain = AC.createGain(); masterGain.gain.value = 0.5; masterGain.connect(AC.destination); }

function playTone(freq, type='square', dur=0.12, vol=0.15, detune=0) {
  if (!AC || AC.state === 'suspended') return;
  try {
    const g = AC.createGain(); g.connect(masterGain);
    g.gain.setValueAtTime(vol, AC.currentTime);
    g.gain.exponentialRampToValueAtTime(0.001, AC.currentTime + dur);
    const o = AC.createOscillator(); o.type = type; o.frequency.value = freq; o.detune.value = detune;
    o.connect(g); o.start(); o.stop(AC.currentTime + dur);
  } catch(e){}
}
function playNoise(dur=0.05, vol=0.08) {
  if (!AC) return;
  try {
    const buf = AC.createBuffer(1, AC.sampleRate * dur, AC.sampleRate);
    const d = buf.getChannelData(0); for(let i=0;i<d.length;i++) d[i]=(Math.random()*2-1);
    const src = AC.createBufferSource(); src.buffer = buf;
    const g = AC.createGain(); g.gain.setValueAtTime(vol,AC.currentTime);
    g.gain.exponentialRampToValueAtTime(0.001,AC.currentTime+dur);
    const f = AC.createBiquadFilter(); f.type='bandpass'; f.frequency.value=800;
    src.connect(f); f.connect(g); g.connect(masterGain); src.start(); src.stop(AC.currentTime+dur);
  } catch(e){}
}
const snd = {
  step: ()=> playTone(110,'triangle',0.05,0.04),
  placeBomb: ()=>{ playTone(200,'square',0.08,0.12); playTone(150,'square',0.12,0.08,50); },
  explode: ()=>{ playNoise(0.25,0.25); playTone(80,'sawtooth',0.3,0.15); },
  enemyDie: ()=>{ playTone(600,'square',0.06,0.1); playTone(400,'square',0.1,0.08,-50); },
  playerHit: ()=>{ playNoise(0.3,0.3); playTone(60,'sawtooth',0.4,0.2); },
  upgrade: ()=>{ [440,550,660,880].forEach((f,i)=> setTimeout(()=>playTone(f,'triangle',0.15,0.1),i*60)); },
  levelUp: ()=>{ [330,440,550,660,880].forEach((f,i)=> setTimeout(()=>playTone(f,'sine',0.2,0.12),i*80)); },
  pickup: ()=>{ playTone(660,'sine',0.1,0.1); playTone(880,'sine',0.12,0.08,30); },
  bossBGM: ()=>{ playTone(55,'sawtooth',0.4,0.1); playTone(58,'sawtooth',0.4,0.06); },
  brickBreak: ()=>{ playNoise(0.1,0.1); playTone(150,'square',0.08,0.06); },
};

// ══════════════════════════════════════════════
//  CONSTANTS
// ══════════════════════════════════════════════
const TILE = 32, COLS = 15, ROWS = 13;
const T = { EMPTY:0, WALL:1, BRICK:2, BOMB:3, FLAME:4, ICE:5, LAVA:6, FOG:7 };
const DIR = { up:[0,-1], down:[0,1], left:[-1,0], right:[1,0] };

const UPGRADES_POOL = [
  { id:'bomb_count', icon:'💣', name:'Extra Bomb', desc:'Place one more bomb at a time.', apply:p=>p.maxBombs++ },
  { id:'range', icon:'🔥', name:'Blast Range', desc:'Explosion reaches further.', apply:p=>p.range++ },
  { id:'speed', icon:'⚡', name:'Swift Feet', desc:'Move faster through the ruins.', apply:p=>p.speed=Math.min(p.speed+0.6,7) },
  { id:'fire_elem', icon:'🌋', name:'Hellfire', desc:'Bombs leave burning tiles for 2s.', apply:p=>p.elements.fire=true },
  { id:'ice_elem', icon:'❄️', name:'Permafrost', desc:'Bombs freeze enemies briefly.', apply:p=>p.elements.ice=true },
  { id:'shock_elem', icon:'⚡', name:'Chain Lightning', desc:'Shock chains to nearby enemies.', apply:p=>p.elements.shock=true },
  { id:'remote', icon:'📡', name:'Remote Det.', desc:'Detonate bombs on command (Space x2).', apply:p=>p.remote=true },
  { id:'pierce', icon:'🗡️', name:'Pierce', desc:'Flames pass through 1 extra brick.', apply:p=>p.pierce++ },
  { id:'shield', icon:'🛡️', name:'Ward', desc:'Absorb the next hit.', apply:p=>p.shield=true },
  { id:'vampiric', icon:'🩸', name:'Life Steal', desc:'Gain score when enemy dies near blast.', apply:p=>p.vampiric=true },
];

// ══════════════════════════════════════════════
//  GAME STATE
// ══════════════════════════════════════════════
let G; // game object

function newPlayer() {
  return { x:1, y:1, px:1*TILE, py:1*TILE, speed:3.5, maxBombs:1, activeBombs:0, range:2,
    lives:3, invincible:0, shield:false, vampiric:false, remote:false, pierce:0,
    elements:{fire:false,ice:false,shock:false}, score:0, kills:0 };
}

function newGame() {
  G = {
    state:'play', level:1, wave:1, bossLevel:false,
    player: newPlayer(),
    grid: [], bombs:[], flames:[], enemies:[], particles:[], pickups:[],
    tickCount:0, frameTime:0,
    keys:{}, touchKeys:{},
    bombCooldown:0, stepTimer:0, upgradePending:false,
    bossHP:0, bossMaxHP:0, bossEnemy:null,
  };
  generateLevel();
}

// ══════════════════════════════════════════════
//  LEVEL GEN
// ══════════════════════════════════════════════
function generateLevel() {
  const { level, bossLevel } = G;
  G.grid = [];
  G.enemies = []; G.bombs = []; G.flames = []; G.pickups = [];

  for(let y=0;y<ROWS;y++) {
    G.grid[y]=[];
    for(let x=0;x<COLS;x++) {
      if(x===0||y===0||x===COLS-1||y===ROWS-1) { G.grid[y][x]=T.WALL; continue; }
      if(x%2===0&&y%2===0) { G.grid[y][x]=T.WALL; continue; }
      G.grid[y][x]=T.EMPTY;
    }
  }
  // Brick density scales with level
  const brickChance = Math.min(0.38 + level*0.02, 0.55);
  for(let y=1;y<ROWS-1;y++) for(let x=1;x<COLS-1;x++) {
    if(G.grid[y][x]!==T.EMPTY) continue;
    if((x<=2&&y<=2)||(x<=2&&y>=ROWS-3)) continue; // safe corners
    if(Math.random()<brickChance) {
      G.grid[y][x]=T.BRICK;
      // special tiles
      if(Math.random()<0.04*level) G.grid[y][x]=T.ICE; // visual only for now
      if(Math.random()<0.03*level) G.grid[y][x]=T.LAVA;
    }
  }

  // Place player
  G.player.x=1; G.player.y=1; G.player.px=TILE+TILE/2; G.player.py=TILE+TILE/2;
  G.player.invincible=120;

  // Spawn enemies
  const count = bossLevel ? 0 : Math.min(3 + level*2, 20);
  for(let i=0;i<count;i++) spawnEnemy();
  if(bossLevel) spawnBoss();
}

function spawnEnemy() {
  const types=['basic','fast','rangy','tank'];
  const weights=[4,3,2,1];
  const total=weights.reduce((a,b)=>a+b,0);
  let r=Math.random()*total, type='basic';
  for(let i=0;i<types.length;i++){r-=weights[i];if(r<=0){type=types[i];break;}}

  const elite = Math.random()<0.15*G.level;
  let x,y,tries=0;
  do { x=Math.floor(Math.random()*(COLS-2))+1; y=Math.floor(Math.random()*(ROWS-2))+1; tries++;
  } while((G.grid[y][x]!==T.EMPTY||(Math.abs(x-1)<3&&Math.abs(y-1)<3)) && tries<200);
  if(tries>=200) return;

  const hp = (type==='tank'?3:type==='basic'?1:type==='fast'?1:2) + (elite?1:0) + Math.floor(G.level/3);
  G.enemies.push({
    x:x*TILE+TILE/2, y:y*TILE+TILE/2, type, hp, maxHp:hp, elite,
    speed: type==='fast'?2.5:type==='tank'?0.8:1.4,
    dir:[1,0], moveTimer:0, moveInterval: type==='fast'?18:type==='tank'?45:28,
    shootTimer:0, frozenTimer:0, burnTimer:0, shockTimer:0,
    dead:false, deathAnim:0
  });
}

function spawnBoss() {
  const bossTypes=['The Warden','The Inferno','The Glacial','The Storm'];
  const bt = bossTypes[Math.floor(G.level/5)%bossTypes.length];
  const hp = 10 + G.level*3;
  G.bossHP = hp; G.bossMaxHP = hp;
  G.bossEnemy = {
    x:Math.floor(COLS/2)*TILE+TILE/2, y:Math.floor(ROWS/2)*TILE+TILE/2,
    type:'boss', name:bt, hp, maxHp:hp, elite:true,
    speed:1.2+G.level*0.1, dir:[1,0], moveTimer:0, moveInterval:20,
    shootTimer:0, frozenTimer:0, burnTimer:0, shockTimer:0,
    dead:false, deathAnim:0, size:2
  };
  G.enemies.push(G.bossEnemy);
}

// ══════════════════════════════════════════════
//  PHYSICS + MOVEMENT
// ══════════════════════════════════════════════
function tileAt(x,y) { return G.grid[y]?.[x] ?? T.WALL; }
function isSolid(tx,ty) { const t=tileAt(tx,ty); return t===T.WALL||t===T.BRICK||t===T.ICE||t===T.LAVA; }
function hasBomb(tx,ty) { return G.bombs.some(b=>b.tx===tx&&b.ty===ty); }

function moveEntity(e, dx, dy, speed) {
  const r = (e.size||1)*TILE*0.38;
  const nx=e.x+dx*speed, ny=e.y+dy*speed;
  const checkX=(ex,ey)=>{
    const checks=[[Math.floor((ex-r)/TILE),Math.floor(ey/TILE)],[Math.ceil((ex+r-1)/TILE),Math.floor(ey/TILE)],
                  [Math.floor((ex-r)/TILE),Math.floor((ey-r)/TILE)],[Math.ceil((ex+r-1)/TILE),Math.floor((ey-r)/TILE)],
                  [Math.floor((ex-r)/TILE),Math.ceil((ey+r-1)/TILE)],[Math.ceil((ex+r-1)/TILE),Math.ceil((ey+r-1)/TILE)]];
    return checks.every(([tx,ty])=>!isSolid(tx,ty)&&!(hasBomb(tx,ty)&&!(e===G.player&&G.player.activeBombs>0&&G.bombs.find(b=>b.justPlaced))));
  };
  let mx=e.x, my=e.y;
  if(checkX(nx,e.y)) mx=nx;
  if(checkX(mx,ny)) my=ny;
  e.x=mx; e.y=my;
}

// ══════════════════════════════════════════════
//  BOMBS + EXPLOSIONS
// ══════════════════════════════════════════════
function placeBomb() {
  const p=G.player;
  if(p.activeBombs>=p.maxBombs) return;
  const tx=Math.floor(p.x/TILE), ty=Math.floor(p.y/TILE);
  if(hasBomb(tx,ty)||isSolid(tx,ty)) return;
  p.activeBombs++;
  G.bombs.push({ tx, ty, timer:160, range:p.range, pierce:p.pierce,
    elements:{...p.elements}, owner:p, justPlaced:true });
  snd.placeBomb();
  setTimeout(()=>{ const b=G.bombs.find(b=>b.justPlaced); if(b) b.justPlaced=false; },100);
}

function detonateRemote() {
  if(!G.player.remote) return;
  G.bombs.forEach(b=>{ if(b.owner===G.player) b.timer=1; });
}

function explodeBomb(bomb) {
  const {tx,ty,range,pierce,elements} = bomb;
  bomb.owner.activeBombs--;
  snd.explode();
  flashScreen(elements.fire?'#d94f3d':elements.ice?'#6ec8c8':'#c8a96e', 0.15);
  spawnParticles(tx*TILE+TILE/2, ty*TILE+TILE/2, elements.fire?'#ff6633':elements.ice?'#6ec8c8':'#c8a96e', 20);

  const dirs=[[1,0],[-1,0],[0,1],[0,-1]];
  const flameTiles=[[tx,ty]];

  dirs.forEach(([dx,dy])=>{
    let pierced=0;
    for(let i=1;i<=range;i++) {
      const fx=tx+dx*i, fy=ty+dy*i;
      const t=tileAt(fx,fy);
      if(t===T.WALL) break;
      if(t===T.BRICK||t===T.ICE||t===T.LAVA) {
        flameTiles.push([fx,fy,'brick']);
        if(pierced<pierce){ pierced++; } else break;
      } else {
        flameTiles.push([fx,fy]);
      }
      // chain bomb
      const chainBomb=G.bombs.find(b=>b.tx===fx&&b.ty===fy&&b!==bomb);
      if(chainBomb) chainBomb.timer=1;
    }
  });

  flameTiles.forEach(([fx,fy,type])=>{
    if(type==='brick') {
      if(tileAt(fx,fy)===T.BRICK||tileAt(fx,fy)===T.ICE||tileAt(fx,fy)===T.LAVA) {
        G.grid[fy][fx]=T.EMPTY; snd.brickBreak();
        if(Math.random()<0.12) spawnPickup(fx,fy);
      }
    }
    G.flames.push({ x:fx, y:fy, timer:30+(elements.fire?60:0), elements });
  });
}

function spawnPickup(tx,ty) {
  const types=['bomb_up','range_up','speed_up'];
  G.pickups.push({ tx, ty, type:types[Math.floor(Math.random()*types.length)], timer:300 });
}

// ══════════════════════════════════════════════
//  PARTICLES
// ══════════════════════════════════════════════
function spawnParticles(x,y,color,count=12) {
  for(let i=0;i<count;i++) {
    const a=Math.random()*Math.PI*2, s=1+Math.random()*4;
    G.particles.push({ x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,life:1,color,size:2+Math.random()*3 });
  }
}

function flashScreen(color,opacity) {
  const el=document.getElementById('screen-flash');
  el.style.background=color; el.style.opacity=opacity;
  setTimeout(()=>el.style.opacity=0, 80);
}

// ══════════════════════════════════════════════
//  ENEMY AI
// ══════════════════════════════════════════════
function updateEnemy(e) {
  if(e.dead) { e.deathAnim++; return; }
  if(e.frozenTimer>0) { e.frozenTimer--; return; }
  if(e.burnTimer>0) { e.burnTimer--; if(e.burnTimer%20===0) damageEnemy(e,1,'fire'); }
  e.moveTimer++;
  if(e.moveTimer>=e.moveInterval) {
    e.moveTimer=0;
    // simple AI: chase player or random
    const p=G.player;
    const px=p.x, py=p.y;
    const dirs=Object.values(DIR);
    let best=null, bestDist=Infinity;
    dirs.forEach(([dx,dy])=>{
      const nx=e.x+dx*TILE, ny=e.y+dy*TILE;
      const tx=Math.floor(nx/TILE), ty=Math.floor(ny/TILE);
      if(!isSolid(tx,ty)&&!hasBomb(tx,ty)) {
        const dist=Math.abs(nx-px)+Math.abs(ny-py);
        if(dist<bestDist) { bestDist=dist; best=[dx,dy]; }
      }
    });
    // fallback random
    if(!best) { const d=dirs[Math.floor(Math.random()*dirs.length)]; best=d; }
    e.dir=best;
  }
  if(e.dir) moveEntity(e, e.dir[0], e.dir[1], e.speed*(e.type==='fast'?1.5:1));

  // Rangy enemy: shoot projectile (simplified as instant flame)
  if(e.type==='rangy') {
    e.shootTimer++;
    if(e.shootTimer>80) {
      e.shootTimer=0;
      const tx=Math.floor(e.x/TILE), ty=Math.floor(e.y/TILE);
      G.flames.push({x:tx,y:ty,timer:25,elements:{},enemy:true});
    }
  }
}

function damageEnemy(e,dmg,source) {
  if(e.dead) return;
  e.hp-=dmg;
  spawnParticles(e.x,e.y,'#d94f3d',6);
  if(G.player.elements.shock&&source==='bomb') {
    G.enemies.forEach(other=>{ if(other!==e&&!other.dead&&Math.abs(other.x-e.x)+Math.abs(other.y-e.y)<TILE*3) { other.hp-=1; other.shockTimer=30; spawnParticles(other.x,other.y,'#c86ec8',4); }});
  }
  if(e.hp<=0) {
    e.dead=true; e.deathAnim=0;
    snd.enemyDie();
    G.player.score+=e.type==='boss'?500:e.elite?50:10;
    G.player.kills++;
    spawnParticles(e.x,e.y,e.elite?'#c8a96e':'#d94f3d',15);
    if(e===G.bossEnemy) { G.bossEnemy=null; setTimeout(()=>endWave(),500); }
  }
}

// ══════════════════════════════════════════════
//  PLAYER DAMAGE
// ══════════════════════════════════════════════
function damagePlayer() {
  const p=G.player;
  if(p.invincible>0) return;
  if(p.shield) { p.shield=false; flashScreen('#c8a96e',0.3); snd.pickup(); return; }
  p.lives--;
  p.invincible=150;
  snd.playerHit();
  flashScreen('#d94f3d',0.5);
  updateHUD();
  if(p.lives<=0) { G.state='dead'; showDeath(); }
}

// ══════════════════════════════════════════════
//  WAVE / LEVEL MANAGEMENT
// ══════════════════════════════════════════════
function checkWaveClear() {
  if(G.enemies.filter(e=>!e.dead).length===0 && !G.bossEnemy) endWave();
}

function endWave() {
  snd.levelUp();
  G.state='upgrade';
  G.wave++; G.level++;
  G.bossLevel = G.level%5===0;
  showUpgradeScreen();
}

function showUpgradeScreen() {
  // Pick 3 random upgrades
  const pool=[...UPGRADES_POOL];
  const choices=[];
  while(choices.length<3&&pool.length>0) {
    const i=Math.floor(Math.random()*pool.length);
    choices.push(pool.splice(i,1)[0]);
  }
  document.getElementById('upgrade-wave').textContent=`WAVE ${G.wave-1} CLEARED`;
  const container=document.getElementById('upgrade-cards');
  container.innerHTML='';
  choices.forEach(u=>{
    const card=document.createElement('div'); card.className='upgrade-card';
    card.innerHTML=`<div class="upgrade-icon">${u.icon}</div><div class="upgrade-name">${u.name}</div><div class="upgrade-desc">${u.desc}</div>`;
    card.addEventListener('click',()=>{ u.apply(G.player); snd.upgrade(); startNextWave(); });
    card.addEventListener('touchend',e=>{e.preventDefault();u.apply(G.player);snd.upgrade();startNextWave();});
    container.appendChild(card);
  });
  document.getElementById('overlay-upgrade').style.display='flex';
}

function startNextWave() {
  document.getElementById('overlay-upgrade').style.display='none';
  if(G.bossLevel) {
    const names=['The Warden','The Inferno','The Glacial','The Storm'];
    document.getElementById('boss-name-text').textContent=names[Math.floor(G.level/5)%names.length];
    document.getElementById('overlay-boss').style.display='flex';
  } else {
    generateLevel(); G.state='play'; updateHUD();
  }
}

function showDeath() {
  const p=G.player;
  document.getElementById('death-stats').innerHTML=`
    <div class="stat-item"><span class="stat-val">${p.score}</span><span class="stat-lbl">Score</span></div>
    <div class="stat-item"><span class="stat-val">${G.level}</span><span class="stat-lbl">Level</span></div>
    <div class="stat-item"><span class="stat-val">${p.kills}</span><span class="stat-lbl">Kills</span></div>`;
  document.getElementById('overlay-death').style.display='flex';
}

// ══════════════════════════════════════════════
//  RENDERER
// ══════════════════════════════════════════════
const canvas=document.getElementById('game');
const ctx=canvas.getContext('2d');

function resizeCanvas() {
  const wrap=document.getElementById('canvas-wrap');
  const maxW=Math.min(window.innerWidth-16, 560);
  const scale=maxW/(COLS*TILE);
  const w=COLS*TILE, h=ROWS*TILE;
  canvas.width=w; canvas.height=h;
  canvas.style.width=Math.floor(w*scale)+'px';
  canvas.style.height=Math.floor(h*scale)+'px';
  wrap.style.width=canvas.style.width; wrap.style.height=canvas.style.height;
}

const COLORS = {
  [T.WALL]:'#0d0d0d', [T.EMPTY]:'#141414', [T.BRICK]:'#2a1f14',
  [T.ICE]:'#142030', [T.LAVA]:'#2a1008', [T.FOG]:'#101018',
};

function drawTile(tx,ty,t) {
  ctx.fillStyle=COLORS[t]||'#141414';
  ctx.fillRect(tx*TILE,ty*TILE,TILE,TILE);
  if(t===T.WALL) { ctx.fillStyle='rgba(255,255,255,0.02)'; ctx.fillRect(tx*TILE,ty*TILE,TILE,1); }
  if(t===T.BRICK) {
    ctx.strokeStyle='rgba(200,169,110,0.15)';ctx.lineWidth=1;
    ctx.strokeRect(tx*TILE+1,ty*TILE+1,TILE-2,TILE-2);
    ctx.fillStyle='rgba(200,169,110,0.05)';ctx.fillRect(tx*TILE+4,ty*TILE+4,TILE-8,TILE-8);
  }
  if(t===T.ICE) { ctx.fillStyle='rgba(110,200,200,0.12)'; ctx.fillRect(tx*TILE,ty*TILE,TILE,TILE); }
  if(t===T.LAVA) {
    const pulse=0.15+0.1*Math.sin(G.tickCount*0.05+tx*0.5+ty*0.3);
    ctx.fillStyle=`rgba(220,80,20,${pulse})`;ctx.fillRect(tx*TILE,ty*TILE,TILE,TILE);
  }
}

function drawBomb(b) {
  const px=b.tx*TILE+TILE/2, py=b.ty*TILE+TILE/2;
  const pulse=0.8+0.2*Math.sin(G.tickCount*0.15);
  const r=TILE*0.35*pulse;
  ctx.beginPath(); ctx.arc(px,py,r,0,Math.PI*2);
  ctx.fillStyle='#1a1a1a'; ctx.fill();
  ctx.strokeStyle=b.elements.fire?'#d94f3d':b.elements.ice?'#6ec8c8':b.elements.shock?'#c86ec8':'#c8a96e';
  ctx.lineWidth=2; ctx.stroke();
  // fuse
  const fuseLen=TILE*0.2*(b.timer/160);
  ctx.beginPath(); ctx.moveTo(px,py-r); ctx.lineTo(px+fuseLen,py-r-fuseLen);
  ctx.strokeStyle='#888'; ctx.lineWidth=1.5; ctx.stroke();
  ctx.beginPath(); ctx.arc(px+fuseLen,py-r-fuseLen,2,0,Math.PI*2);
  ctx.fillStyle='#ff8'; ctx.fill();
}

function drawFlame(f) {
  const px=f.x*TILE, py=f.y*TILE;
  const alpha=f.timer/50;
  const col=f.elements?.fire?`rgba(220,80,20,${alpha})`:f.elements?.ice?`rgba(110,200,200,${alpha})`:f.elements?.shock?`rgba(200,110,200,${alpha})`:`rgba(200,169,110,${alpha*0.9})`;
  ctx.fillStyle=col; ctx.fillRect(px,py,TILE,TILE);
  // inner glow
  const cx=px+TILE/2, cy=py+TILE/2;
  const grad=ctx.createRadialGradient(cx,cy,0,cx,cy,TILE*0.5);
  grad.addColorStop(0,'rgba(255,255,200,0.3)'); grad.addColorStop(1,'transparent');
  ctx.fillStyle=grad; ctx.fillRect(px,py,TILE,TILE);
}

function drawEnemy(e) {
  if(e.dead) {
    const a=1-e.deathAnim/20; if(a<=0) return;
    ctx.globalAlpha=a;
    spawnParticles(e.x,e.y,'#d94f3d',1);
  }
  const size=((e.size||1)*TILE*0.38);
  const cx=e.x, cy=e.y;
  // body
  ctx.beginPath(); ctx.arc(cx,cy,size,0,Math.PI*2);
  const eColor=e.type==='tank'?'#4a3a3a':e.type==='fast'?'#3a4a3a':e.type==='rangy'?'#3a3a5a':'#3a3a3a';
  ctx.fillStyle=e.frozenTimer>0?'#6ec8c8':e.burnTimer>0?'#d94f3d':e.elite?'#2a2010':eColor;
  ctx.fill();
  ctx.strokeStyle=e.elite?'#c8a96e':'rgba(255,255,255,0.15)'; ctx.lineWidth=e.elite?2:1; ctx.stroke();
  // eyes
  ctx.fillStyle='#fff';
  const ew=3,eh=4;
  ctx.fillRect(cx-6,cy-4,ew,eh); ctx.fillRect(cx+3,cy-4,ew,eh);
  ctx.fillStyle='#d94f3d';
  ctx.fillRect(cx-5,cy-3,2,3); ctx.fillRect(cx+4,cy-3,2,3);
  // HP bar for enemies with >1 hp
  if(e.maxHp>1) {
    const bw=size*2, bh=3, bx=cx-size, by=cy-size-8;
    ctx.fillStyle='#1a1a1a'; ctx.fillRect(bx,by,bw,bh);
    ctx.fillStyle=e.elite?'#c8a96e':'#d94f3d';
    ctx.fillRect(bx,by,bw*(e.hp/e.maxHp),bh);
  }
  // Boss health bar at top
  if(e.type==='boss'&&e===G.bossEnemy) {
    ctx.globalAlpha=1;
    const bw=canvas.width-40, bh=6, bx=20, by=8;
    ctx.fillStyle='rgba(0,0,0,0.7)'; ctx.fillRect(bx-2,by-2,bw+4,bh+4);
    ctx.fillStyle='#1a1a1a'; ctx.fillRect(bx,by,bw,bh);
    ctx.fillStyle='#c8a96e'; ctx.fillRect(bx,by,bw*(G.bossHP/G.bossMaxHP),bh);
    ctx.fillStyle=e.elite?'#c8a96e':'#fff'; ctx.font='bold 8px Space Mono'; ctx.textAlign='center';
    ctx.fillText(e.name||'BOSS', canvas.width/2, by+bh+10);
  }
  ctx.globalAlpha=1;
  if(e.shockTimer>0) { ctx.strokeStyle='#c86ec8';ctx.lineWidth=1;ctx.setLineDash([2,2]);ctx.beginPath();ctx.arc(cx,cy,size+4,0,Math.PI*2);ctx.stroke();ctx.setLineDash([]); }
}

function drawPlayer() {
  const p=G.player;
  if(p.invincible>0&&Math.floor(G.tickCount/4)%2===0) return;
  const cx=p.x, cy=p.y, r=TILE*0.38;
  // body
  ctx.beginPath(); ctx.arc(cx,cy,r,0,Math.PI*2);
  ctx.fillStyle=p.shield?'rgba(200,169,110,0.3)':'#1a1a2a';
  ctx.fill();
  ctx.strokeStyle='#c8a96e'; ctx.lineWidth=2; ctx.stroke();
  // face
  ctx.fillStyle='rgba(245,240,235,0.9)'; ctx.fillRect(cx-6,cy-5,4,5); ctx.fillRect(cx+2,cy-5,4,5);
  ctx.fillStyle='#080808'; ctx.fillRect(cx-5,cy-4,2,4); ctx.fillRect(cx+3,cy-4,2,4);
  // shield aura
  if(p.shield) { ctx.strokeStyle='rgba(200,169,110,0.5)';ctx.lineWidth=3;ctx.beginPath();ctx.arc(cx,cy,r+4,0,Math.PI*2);ctx.stroke(); }
  // element indicators
  let ix=cx-8;
  if(p.elements.fire){ctx.fillStyle='#d94f3d';ctx.fillRect(ix,cy+r+2,5,3);ix+=8;}
  if(p.elements.ice){ctx.fillStyle='#6ec8c8';ctx.fillRect(ix,cy+r+2,5,3);ix+=8;}
  if(p.elements.shock){ctx.fillStyle='#c86ec8';ctx.fillRect(ix,cy+r+2,5,3);}
}

function drawPickup(pk) {
  const cx=pk.tx*TILE+TILE/2, cy=pk.ty*TILE+TILE/2;
  const bob=Math.sin(G.tickCount*0.1)*2;
  ctx.save(); ctx.translate(0,bob);
  const grd=ctx.createRadialGradient(cx,cy+bob,0,cx,cy+bob,TILE*0.4);
  grd.addColorStop(0,'rgba(200,169,110,0.3)'); grd.addColorStop(1,'transparent');
  ctx.fillStyle=grd; ctx.fillRect(pk.tx*TILE,pk.ty*TILE,TILE,TILE);
  ctx.fillStyle='#c8a96e'; ctx.font='14px serif'; ctx.textAlign='center'; ctx.textBaseline='middle';
  const icon=pk.type==='bomb_up'?'💣':pk.type==='range_up'?'🔥':'⚡';
  ctx.fillText(icon,cx,cy+bob); ctx.restore();
}

function drawParticles() {
  G.particles.forEach(pt=>{
    ctx.globalAlpha=pt.life;
    ctx.fillStyle=pt.color;
    ctx.fillRect(pt.x-pt.size/2,pt.y-pt.size/2,pt.size,pt.size);
  });
  ctx.globalAlpha=1;
}

function render() {
  ctx.fillStyle='#080808'; ctx.fillRect(0,0,canvas.width,canvas.height);
  // Grid
  for(let y=0;y<ROWS;y++) for(let x=0;x<COLS;x++) drawTile(x,y,G.grid[y][x]);
  // Flames
  G.flames.forEach(drawFlame);
  // Pickups
  G.pickups.forEach(drawPickup);
  // Bombs
  G.bombs.forEach(drawBomb);
  // Enemies
  G.enemies.forEach(drawEnemy);
  // Player
  drawPlayer();
  // Particles
  drawParticles();
  // Grid lines subtle
  ctx.strokeStyle='rgba(255,255,255,0.02)'; ctx.lineWidth=0.5;
  for(let x=0;x<=COLS;x++){ctx.beginPath();ctx.moveTo(x*TILE,0);ctx.lineTo(x*TILE,ROWS*TILE);ctx.stroke();}
  for(let y=0;y<=ROWS;y++){ctx.beginPath();ctx.moveTo(0,y*TILE);ctx.lineTo(COLS*TILE,y*TILE);ctx.stroke();}
}

// ══════════════════════════════════════════════
//  GAME LOOP
// ══════════════════════════════════════════════
let lastTime=0, paused=false;

function gameLoop(ts) {
  requestAnimationFrame(gameLoop);
  const dt=ts-lastTime; lastTime=ts;
  if(G.state!=='play'||paused) { if(G.state==='play'||paused) render(); return; }

  G.tickCount++;
  const p=G.player;
  if(p.invincible>0) p.invincible--;
  if(G.bombCooldown>0) G.bombCooldown--;

  // Input
  const keys={...G.keys,...G.touchKeys};
  let dx=0,dy=0;
  if(keys['ArrowLeft']||keys['KeyA']||keys['left']) dx=-1;
  if(keys['ArrowRight']||keys['KeyD']||keys['right']) dx=1;
  if(keys['ArrowUp']||keys['KeyW']||keys['up']) dy=-1;
  if(keys['ArrowDown']||keys['KeyS']||keys['down']) dy=1;
  if(dx!==0&&dy!==0){dx*=0.707;dy*=0.707;}
  if(dx!==0||dy!==0) {
    moveEntity(p,dx,dy,p.speed);
    if(++G.stepTimer>12){G.stepTimer=0;snd.step();}
  }
  if((keys['Space']||keys['bomb'])&&G.bombCooldown===0) { placeBomb(); G.bombCooldown=10; }

  // Lava damage
  const ptx=Math.floor(p.x/TILE),pty=Math.floor(p.y/TILE);
  if(tileAt(ptx,pty)===T.LAVA&&G.tickCount%60===0) damagePlayer();

  // Bomb timers
  G.bombs=G.bombs.filter(b=>{
    b.timer--;
    if(b.timer<=0){explodeBomb(b);return false;}
    return true;
  });
  // Flame timers
  G.flames=G.flames.filter(f=>{f.timer--;return f.timer>0;});
  // Flame hits
  G.flames.forEach(f=>{
    const fx=f.x*TILE+TILE/2, fy=f.y*TILE+TILE/2;
    if(Math.abs(p.x-fx)<TILE*0.45&&Math.abs(p.y-fy)<TILE*0.45&&!f.enemy) damagePlayer();
    G.enemies.forEach(e=>{
      if(e.dead) return;
      if(Math.abs(e.x-fx)<TILE*0.45&&Math.abs(e.y-fy)<TILE*0.45) {
        if(f.elements?.ice) e.frozenTimer=90;
        else if(f.elements?.fire) { if(!e.burnTimer) damageEnemy(e,1,'fire'); e.burnTimer=60; }
        else damageEnemy(e,1,'bomb');
      }
    });
  });
  // Pickup collision
  G.pickups=G.pickups.filter(pk=>{
    pk.timer--;
    const cx=pk.tx*TILE+TILE/2, cy=pk.ty*TILE+TILE/2;
    if(Math.abs(p.x-cx)<TILE*0.5&&Math.abs(p.y-cy)<TILE*0.5) {
      if(pk.type==='bomb_up') p.maxBombs++;
      else if(pk.type==='range_up') p.range++;
      else if(pk.type==='speed_up') p.speed=Math.min(p.speed+0.5,7);
      snd.pickup(); G.player.score+=5; updateHUD();
      return false;
    }
    return pk.timer>0;
  });
  // Enemy collision
  G.enemies.forEach(e=>{
    if(e.dead) return;
    if(Math.abs(p.x-e.x)<TILE*0.55&&Math.abs(p.y-e.y)<TILE*0.55) damagePlayer();
  });
  // Update enemies
  G.enemies.forEach(updateEnemy);
  G.enemies=G.enemies.filter(e=>!e.dead||e.deathAnim<20);
  if(G.bossEnemy&&G.bossEnemy.hp!==undefined) G.bossHP=G.bossEnemy.hp;
  // Update particles
  G.particles.forEach(pt=>{pt.x+=pt.vx;pt.y+=pt.vy;pt.vy+=0.1;pt.life-=0.05;pt.vx*=0.92;pt.vy*=0.92;});
  G.particles=G.particles.filter(pt=>pt.life>0);
  // Check wave clear
  checkWaveClear();
  updateHUD();
  render();
}

document.getElementById('btn-quit').addEventListener('click',()=>{paused=false;document.getElementById('overlay-pause').style.display='none';G.state='dead';showDeath();});
document.getElementById('btn-start').addEventListener('click',()=>{
  if(AC&&AC.state==='suspended')AC.resume();
  document.getElementById('overlay-start').style.display='none';
  newGame(); G.state='play'; updateHUD(); requestAnimationFrame(gameLoop);
});
document.getElementById('btn-restart').addEventListener('click',()=>{
  document.getElementById('overlay-death').style.display='none';
  newGame(); G.state='play'; updateHUD();
});
document.getElementById('btn-boss-start').addEventListener('click',()=>{
  document.getElementById('overlay-boss').style.display='none';
  snd.bossBGM(); generateLevel(); G.state='play'; updateHUD();
});

window.addEventListener('resize',resizeCanvas);
resizeCanvas();
newGame();
</script>
</body>
</html>
